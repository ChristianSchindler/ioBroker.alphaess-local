# Creates a new release that can be installed in any ioBroker:
#   GitHub → Actions → Release → "Run workflow" → enter version + changelog.
# The workflow sets the version, runs the tests, builds the widget, commits the version together with the
# built widget (ioBroker installs GitHub URLs straight from the git commit, so widgets/ must be in it),
# tags it and publishes a GitHub Release (with the .tgz attached for manual installs).
name: Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'New version (x.y.z), e.g. 0.2.0'
                required: true
            changelog:
                description: 'What changed (shown in ioBroker and on the release page)'
                required: true

permissions:
    contents: write

concurrency: release

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      src-widgets/package-lock.json

            - name: Check version
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                      echo "::error::Version must look like 1.2.3"; exit 1
                  fi
                  if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
                      echo "::error::Tag v$VERSION already exists"; exit 1
                  fi

            - name: Set version
              env:
                  VERSION: ${{ inputs.version }}
                  CHANGELOG: ${{ inputs.changelog }}
              run: node scripts/set-version.mjs "$VERSION" "$CHANGELOG"

            - name: Install + test
              run: |
                  npm ci
                  npm test

            - name: Build VIS-2 widget
              run: |
                  npm ci --prefix src-widgets
                  npm run build --prefix src-widgets

            - name: Pack adapter
              id: pack
              run: |
                  FILE=$(npm pack --silent)
                  echo "file=$FILE" >> "$GITHUB_OUTPUT"
                  tar -tzf "$FILE"

            - name: Commit + tag version
              env:
                  VERSION: ${{ inputs.version }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add package.json package-lock.json io-package.json src-widgets/package.json src-widgets/package-lock.json
                  # widgets/ is ignored for local builds but must be part of the release commit
                  git add -f widgets
                  git commit -m "Release v$VERSION"
                  git tag "v$VERSION"
                  git push origin HEAD "v$VERSION"

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ inputs.version }}
                  CHANGELOG: ${{ inputs.changelog }}
                  REPO_URL: ${{ github.server_url }}/${{ github.repository }}
              run: |
                  cat > notes.md <<EOF
                  $CHANGELOG

                  ### Install / update in ioBroker
                  Admin → Adapters → **Install from custom URL** (GitHub icon) → tab **Custom** → paste:

                  \`\`\`
                  $REPO_URL/tree/v$VERSION
                  \`\`\`

                  or on the command line: \`iobroker url $REPO_URL/tree/v$VERSION\`
                  EOF
                  gh release create "v$VERSION" "${{ steps.pack.outputs.file }}" \
                      --title "v$VERSION" --notes-file notes.md --latest
