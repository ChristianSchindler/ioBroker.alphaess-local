name: Test

on:
    push:
        branches: [main]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      src-widgets/package-lock.json

            - name: Install adapter dependencies
              run: npm ci

            - name: Unit tests
              run: npm test

            - name: Build VIS-2 widget
              run: |
                  npm ci --prefix src-widgets
                  npm run build --prefix src-widgets

            - name: Check package contents
              run: npm pack --dry-run
